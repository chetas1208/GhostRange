[pytest]
; Monorepo has many packages/*/tests/ dirs, some sharing identical test-file
; basenames (e.g. test_http_client.py in both vultr-control and netbird-control).
; importlib mode imports each by its actual file path instead of an inferred
; dotted module name, so same-named files across packages never collide.
addopts = --import-mode=importlib
asyncio_mode = auto
