# TEMPLATE ONLY. Never fill in real values here and never `kubectl apply -f` this
# file directly — it is intentionally NOT listed in kustomization.yaml's resources
# so a plain `kubectl apply -k` cannot accidentally create a secret full of
# placeholders. Same convention as .env.production.example vs .env.production at
# the repo root: this file is the shape, not the content.
#
# Real secret creation (pick one, both keep the values out of git):
#
#   1) Imperative, from the existing (gitignored) .env.production file, filtering
#      to only the secret keys this Secret expects:
#        kubectl create secret generic ghostrange-api-secrets -n ghostrange \
#          --from-literal=POSTGRES_DSN="$POSTGRES_DSN" \
#          --from-literal=S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
#          --from-literal=S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
#          --from-literal=VULTR_INFERENCE_API_KEY="$VULTR_INFERENCE_API_KEY" \
#          --from-literal=VULTR_API_KEY="$VULTR_API_KEY" \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#   2) External Secrets Operator (recommended once this cluster is a
#      long-lived real deployment, not just a demo): install
#      https://external-secrets.io, point a SecretStore at a real secret
#      manager, and let it materialize a Secret named ghostrange-api-secrets
#      with these same keys. GhostRange's Deployment spec does not care which
#      path produced the Secret, only that it exists with these key names.
apiVersion: v1
kind: Secret
metadata:
  name: ghostrange-api-secrets
type: Opaque
stringData:
  POSTGRES_DSN: "CHANGE_ME_postgresql://ghostrange_app:PASSWORD@vultr-managed-pg-host:16751/defaultdb?sslmode=require"
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"
  VULTR_INFERENCE_API_KEY: "CHANGE_ME"
  VULTR_API_KEY: "CHANGE_ME"
