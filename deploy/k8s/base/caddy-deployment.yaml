# Caddy is the ingress here, not a separate ingress-nginx controller.
# WHY: VKE does not ship an ingress controller by default (unlike its Cloud
# Controller Manager and CSI driver, which are automatic — see
# docs/research/VULTR.md's new VKE section). Installing and maintaining
# ingress-nginx just to re-express the same three path rules Caddy already
# runs in production today would be a second routing configuration to keep in
# sync with deploy/caddy/Caddyfile for no behavioral gain. Reusing the exact
# same Caddyfile (see deploy/k8s/base/Caddyfile) as a plain Deployment behind a
# Service type=LoadBalancer keeps routing logic in exactly one place and lets
# Vultr's Cloud Controller Manager provision a real Vultr Load Balancer for it
# automatically, the same way it would for an ingress-nginx Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  labels:
    app: caddy
    app.kubernetes.io/part-of: ghostrange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: caddyfile
          configMap:
            name: caddy-config-file
        - name: caddy-data
          emptyDir: {} # ACME cert cache; see VKE_DEPLOY.md re: PVC upgrade once TLS is enabled
        - name: caddy-config
          emptyDir: {}
