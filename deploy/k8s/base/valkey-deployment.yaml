# Mirrors docker-compose.prod.yml's `valkey` service exactly:
# image valkey/valkey:7-alpine, no persistence (--save "" --appendonly no) because
# this Valkey is used only as the pub/sub event-transport / cache (Decisions.md #4),
# never as a durability tier — evidence durability is Object Storage + Managed Postgres,
# not this cache. Same reasoning as the compose file: plain Deployment, not a
# StatefulSet, because there is no volume to keep stable identity for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app: valkey
    app.kubernetes.io/part-of: ghostrange
spec:
  replicas: 1
  strategy:
    type: Recreate # single ephemeral cache instance; avoid two valkeys briefly coexisting
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7-alpine
          command: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
