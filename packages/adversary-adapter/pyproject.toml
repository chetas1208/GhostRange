[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-adversary-adapter"
version = "0.1.0"
description = "Caldera / ART adapters — scoped to authorized range only"
requires-python = ">=3.11"
dependencies = ["ghostrange-contracts", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_adversary_adapter*"]
