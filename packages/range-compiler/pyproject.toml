[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-range-compiler"
version = "0.1.0"
description = "M5 Range Compiler: import IaC → normalized graph → sanitized twin → RangeSpecV2"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
    "PyYAML>=6.0",
    "python-hcl2>=4.3,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_range_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
