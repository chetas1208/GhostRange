apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-api
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: worker-api
          image: acme/worker-api:1.2.3
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: worker-api
spec:
  type: LoadBalancer
  ports:
    - port: 443
  selector:
    app: worker-api
