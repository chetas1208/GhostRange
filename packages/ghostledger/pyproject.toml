[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-ghostledger"
version = "0.1.0"
description = "M7 GhostLedger: experiment manifests, attestation, bundles, offline verification"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghostrange-verify = "ghostrange_ghostledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_ghostledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
