[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-ghostcausal"
version = "0.1.0"
description = "M14 GhostCausal: mechanism discovery and transportability"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
    "ghostrange-ghostmesh",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghostrange-ghostcausal = "ghostrange_ghostcausal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_ghostcausal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
