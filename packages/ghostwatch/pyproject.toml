[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-ghostwatch"
version = "0.1.0"
description = "M12 GhostWatch: approval-bound deployment observation"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghostrange-ghostwatch = "ghostrange_ghostwatch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_ghostwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
