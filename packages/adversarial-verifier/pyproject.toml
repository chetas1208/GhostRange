[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-adversarial-verifier"
version = "0.1.0"
description = "M8 claim-bounded adversarial verification and counterexample search"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_adversarial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
