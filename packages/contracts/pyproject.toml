[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-contracts"
version = "0.1.0"
description = "Single source of truth Pydantic v2 domain models for GhostRange, exported to JSON Schema."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
