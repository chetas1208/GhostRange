[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-execution-graph"
version = "0.1.0"
description = "Execution DAG algorithms for GhostRange tasks"
requires-python = ">=3.11"
dependencies = ["ghostrange-contracts"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_execution_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
