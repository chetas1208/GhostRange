[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-evidence"
version = "0.1.0"
description = "Artifact storage, deterministic scenario verification, and provenance-chain queries for GhostRange's Claim -> Verification -> Observation -> Execution -> World -> Artifact evidence chain."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
vultr = [
    # Vultr Object Storage is S3-compatible; boto3 talks to it via a custom
    # endpoint_url. Only required if VultrObjectStorageStore is actually
    # instantiated -- the local filesystem store has no such dependency.
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_evidence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
