[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-ghostdirector"
version = "0.1.0"
description = "M9 GhostDirector — active experiment design (not GhostScheduler)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_director*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
