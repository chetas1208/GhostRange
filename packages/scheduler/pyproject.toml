[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-scheduler"
version = "0.1.0"
description = "GhostScheduler v1: deterministic, explainable compute scheduling for GhostRange investigation tasks. No RL, no learned policy, no LLM placement decisions -- every decision resolves to fixed ReasonCode(s)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
    "ghostrange-cost",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
