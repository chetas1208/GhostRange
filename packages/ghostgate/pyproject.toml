[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-ghostgate"
version = "0.1.0"
description = "M11 GhostGate: human-controlled promotion packages (no production mutation)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
    "ghostrange-range-compiler",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghostrange-promotion = "ghostrange_ghostgate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_ghostgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
