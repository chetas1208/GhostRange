[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-range-iac"
version = "0.1.0"
description = "Compiler: RangeSpecV1 -> Vultr provisioning requests (VPC, firewall group, instances) + cloud-init, for GhostRange range provisioning."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "ghostrange-contracts",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_range_iac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
