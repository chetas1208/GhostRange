[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrange-vultr-control"
version = "0.1.0"
description = "Single choke point for all Vultr API calls: RealVultrProvider (live Vultr API v2) and MockVultrProvider (deterministic in-memory fake), behind one stable provider interface."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_vultr_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
