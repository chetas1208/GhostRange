# ghostrange-auth-lab-v1 gateway (gw01) — reverse proxy in front of the api tier.
#
# Placeholder scenario config: proxies everything to `api`. The wave-2 "controlled
# scenario" owner (docs/milestones/M2_COORDINATION.md item 06) will replace routing
# rules/headers here as the real auth-lab scenario needs (e.g. deliberately missing
# auth headers, permissive CORS, etc.) without needing any change to rangespec.yaml,
# topology.yaml, or the provisioning pipeline in packages/range-iac.

server {
    listen 80;
    server_name _;

    location /health {
        return 200 "gateway ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
