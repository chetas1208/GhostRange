  - id: "6b896360-04f9-4879-a450-3da1171fef75"
    name: "auth-lab-core"
    cidr: "10.60.0.0/24"
    description: >
      Single logical segment for M2. All four assets are declared on one network because
      the M2 scope consolidates them onto one physical VM (see topology.yaml); a v2 range
      would split this into a DMZ segment (gateway) and an internal segment (api/auth/data
      store) once physical placement actually spans multiple hosts.

