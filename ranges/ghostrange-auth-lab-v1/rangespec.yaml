# ghostrange-auth-lab-v1 — RangeSpecV1 (LOGICAL topology only)
#
# This file is a real RangeSpecV1 instance (packages/contracts/ghostrange_contracts/range.py).
# It validates as-is against RangeSpecV1.model_validate(yaml.safe_load(...)) — see
# packages/range-iac/tests/test_rangespec_validates.py for the proof.
#
# IMPORTANT — logical vs physical:
#   This file describes WHAT the range logically consists of (networks, assets, their
#   roles, what image/software each one runs, how critical each one is). It says nothing
#   about which physical Vultr instance(s) any asset actually lands on. That mapping is a
#   separate, compiler-owned artifact: ./topology.yaml (RangeTopologyPlanV1, defined in
#   packages/range-iac — NOT part of the frozen ghostrange_contracts schema). See
#   docs/adr/ADR-M2-RANGE-PROVISIONING.md for why this split exists and why it matters once
#   GhostScheduler starts moving workloads between physical hosts.
#
# Conceptual chain this range models (a minimal internet-facing auth path):
#   INTERNET / TEST ORIGIN -> gw01 (gateway) -> api01 (api) -> auth01 (auth) -> db01 (data store)

schema_version: "1"
id: "112ab381-173f-46f3-9e81-772345e47118"
name: "ghostrange-auth-lab-v1"
description: >
  Minimal 4-tier authorized-infrastructure reconstruction (gateway -> api -> auth ->
  data store) used as the canonical M2 provisioning range. Scenario/vulnerability content
  (the actual auth-lab application logic, CVEs, injected misconfigurations) is owned by the
  wave-2 "controlled scenario" agent; this spec's asset `image` fields are honest,
  minimal, working stand-ins that prove the RangeSpec -> real-infrastructure pipeline end
  to end (see ranges/ghostrange-auth-lab-v1/docker/) and can be swapped for the final
  scenario images without touching this file's shape.
owner: "chetasparekh2003@gmail.com"

