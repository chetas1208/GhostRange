[project]
name = "ghostrange-api"
version = "0.1.0"
description = "GhostRange M2 API — authoritative events, SSE, one-world orchestration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "ghostrange-contracts",
  "ghostrange-events",
  "ghostrange-range-runtime",
  "ghostrange-range-iac",
  "ghostrange-vultr-control",
  "ghostrange-netbird-control",
  "ghostrange-scheduler",
  "ghostrange-cost",
  "ghostrange-policy-check",
  "ghostrange-evidence",
  "ghostrange-range-compiler",
  "ghostrange-ghostdirector",
  "ghostrange-adversarial-verifier",
  "ghostrange-ghostledger",
  "ghostrange-ghostgate",
  "ghostrange-ghostwatch",
  "ghostrange-ghostmesh",
  "ghostrange-ghostcausal",
  "ghostrange-ghostshield",
  "ghostrange-ghostevolve",
  "ghostrange-ghostarena",
  "ghostrange-ghostruntime",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "redis>=5",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
store = ["ghostrange-events[store]", "ghostrange-evidence[vultr]"]

[project.scripts]
ghostrange-api = "ghostrange_api.main:cli"
ghostrange-reconcile = "ghostrange_api.reconcile:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostrange_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
