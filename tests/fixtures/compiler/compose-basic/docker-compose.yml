services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    depends_on: [api]
  api:
    image: python:3.12-slim
    environment:
      AUTH_URL: "http://auth:8090"
    depends_on: [auth]
  auth:
    image: python:3.12-slim
    environment:
      AUTH_SECRET: "do-not-copy-me"
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: "lab-only"

networks:
  default: {}
